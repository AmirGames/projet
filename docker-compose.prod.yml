# Production sur un seul serveur (VPS Scaleway, Ubuntu 24.04 ou Debian 12).
#
#   Internet ──443──> Caddy ──> frontend:3000   (site, tous les domaines publics)
#                          └──> backend:3001    (API + temps réel, DOMAINE_API)
#                                  ├──> postgres:5432 (jamais exposé)
#                                  └──> redis:6379    (relie les instances du temps réel)
#
# Caddy obtient et renouvelle seul les certificats HTTPS (Let's Encrypt).
# Seuls les ports 80 et 443 sont ouverts ; la base n'écoute que sur le réseau
# interne de Docker.
#
# Toujours lancé avec le fichier de variables, via deploy/zup.sh :
#   ./deploy/zup.sh up        (ou : docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build)

name: zupone

services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zupone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-zupone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Relie les instances de l'API pour le temps réel (adaptateur Socket.IO) :
  # un événement émis par une instance atteint les navigateurs branchés sur
  # les autres. Sans persistance : il ne transporte que des messages.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-zupone}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zupone}?schema=public
      REDIS_URL: redis://redis:6379
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      PRIVATE_DOCUMENTS_DIR: /app/private-documents
      API_URL: https://${DOMAINE_API:?DOMAINE_API manquant dans .env.production}
      # Un seul proxy devant l'API : Caddy.
      TRUST_PROXY: 1
      # Si renseigné, remplace le compte de sauts par les IP/CIDR réels des proxys.
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      # Gratuit local par défaut ; le profil assistant-local reste optionnel.
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-ollama}
      ASSISTANT_OLLAMA_URL: ${ASSISTANT_OLLAMA_URL:-http://ollama:11434}
      ASSISTANT_OLLAMA_MODEL: ${ASSISTANT_OLLAMA_MODEL:-}
      # Horaires d'ouverture, créneaux de retrait, arrêtés hebdomadaires : le
      # code compte en heure locale. Sans ce réglage le conteneur compte en
      # UTC, et une boutique ouverte « 11:00 » l'était à 13:00 à Paris.
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
      - private_documents:/app/private-documents
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Aucun port publié. Modèles cloud et recherche web désactivés.
  ollama:
    profiles: ["assistant-local"]
    image: ${ASSISTANT_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama_models:/root/.ollama

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAINE_API}
        NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:?FRONTEND_URL manquant dans .env.production}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_ENABLE_STRIPE: ${ENABLE_STRIPE:-true}
        NEXT_PUBLIC_DOMAINE_GROUPE: ${NEXT_PUBLIC_DOMAINE_GROUPE:-}
        NEXT_PUBLIC_DOMAINE_PUBLIC: ${NEXT_PUBLIC_DOMAINE_PUBLIC:-}
        NEXT_PUBLIC_DOMAINE_PRO: ${NEXT_PUBLIC_DOMAINE_PRO:-}
        NEXT_PUBLIC_DOMAINE_LIVREUR: ${NEXT_PUBLIC_DOMAINE_LIVREUR:-}
        NEXT_PUBLIC_DOMAINE_VITRINE: ${NEXT_PUBLIC_DOMAINE_VITRINE:-}
        NEXT_PUBLIC_DOMAINE_DRIVE: ${NEXT_PUBLIC_DOMAINE_DRIVE:-}
        NEXT_PUBLIC_DOMAINE_CHAUFFEUR: ${NEXT_PUBLIC_DOMAINE_CHAUFFEUR:-}
    restart: unless-stopped
    environment:
      # Même heure que l'API pour les pages rendues côté serveur.
      TZ: ${TZ:-Europe/Paris}
      # Côté serveur (connexion unique, plan du site), l'API se joint
      # directement, sans ressortir par Internet.
      API_INTERNAL_URL: http://backend:3001
      # Serveur uniquement ; jamais NEXT_PUBLIC. Même mapping/secret que l'API.
      ASSISTANT_HOSTS: ${ASSISTANT_HOSTS:-}
      ASSISTANT_GATEWAY_SECRET: ${ASSISTANT_GATEWAY_SECRET:-}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINES_SITE: ${DOMAINES_SITE:?DOMAINES_SITE manquant dans .env.production}
      DOMAINE_API: ${DOMAINE_API}
      EMAIL_LETSENCRYPT: ${EMAIL_LETSENCRYPT:?EMAIL_LETSENCRYPT manquant dans .env.production}
    volumes:
      # Le dossier, pas le fichier seul : git remplace le Caddyfile à chaque
      # mise à jour, et un fichier monté seul restait figé dans sa version du
      # démarrage. deploy/zup.sh up demande ensuite à Caddy de le relire.
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  clamav_data:
  private_documents:
  postgres_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
  ollama_models:
