# Environnement de démonstration, à part de la production.
#
# Un serveur, une base, des clés et des domaines qui n'ont rien de commun avec
# la production : on peut y inviter un prospect, y casser des choses, et tout
# remettre à zéro chaque nuit. Rien n'y part vraiment :
#   - Stripe est coupé (aucune carte, aucun paiement, même en test) ;
#   - les courriels vont dans Mailpit, personne ne les reçoit ;
#   - ni SMS, ni push, ni virement SEPA.
#
# À installer sur son propre serveur (80 et 443 y sont pris par ce Caddy).
# Toujours lancé avec le fichier de variables, via deploy/demo.sh :
#   ./deploy/demo.sh up

name: zupone-demo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zupone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.demo}
      POSTGRES_DB: zupone_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zupone -d zupone_demo"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Reçoit tous les courriels de la démo. Interface sur 127.0.0.1:8025 du
  # serveur seulement : ssh -L 8025:127.0.0.1:8025 <serveur>
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.demo
    environment: &backend-env
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://zupone:${POSTGRES_PASSWORD}@postgres:5432/zupone_demo?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: https://${DOMAINE_API:?DOMAINE_API manquant dans .env.demo}
      TRUST_PROXY: 1
      TZ: ${TZ:-Europe/Paris}
      # Aucun paiement, aucun courriel vérifié : un visiteur s'inscrit et
      # entre aussitôt, sans boîte aux lettres à consulter.
      ENABLE_STRIPE: "false"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      ENABLE_EMAIL_VERIFICATION: "false"
      REQUIRE_EMAIL_VERIFICATION: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_FROM: ""
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      MONITORING_ALERTS: "false"
      UPTIME_ENABLED: "false"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Remet la démo à zéro : vide la base, puis recrée le jeu d'essai par l'API.
  # Lancé à la demande (profil « outils ») par deploy/demo.sh reset. Les
  # scripts sont montés depuis le dépôt : l'image de l'API ne les embarque pas.
  reset:
    build:
      context: ./backend
    profiles: ["outils"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-env
      VERIF_API_URL: http://backend:3001
      # Le garde-fou de reinitialiser.mjs exige « test » dans le nom de la
      # base ; celle-ci est la démo, on l'autorise expressément.
      VERIF_AUTORISER_RESET: "oui"
    env_file: .env.demo
    volumes:
      - ./backend/scripts:/app/scripts:ro
    working_dir: /app
    command: ["sh", "-c", "node scripts/verification/reinitialiser.mjs && node scripts/seed-demo.mjs"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAINE_API}
        NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:?FRONTEND_URL manquant dans .env.demo}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
        NEXT_PUBLIC_ENABLE_STRIPE: "false"
        NEXT_PUBLIC_DEMO: "true"
        NEXT_PUBLIC_DOMAINE_GROUPE: ${NEXT_PUBLIC_DOMAINE_GROUPE:-}
        NEXT_PUBLIC_DOMAINE_PUBLIC: ${NEXT_PUBLIC_DOMAINE_PUBLIC:-}
        NEXT_PUBLIC_DOMAINE_PRO: ${NEXT_PUBLIC_DOMAINE_PRO:-}
        NEXT_PUBLIC_DOMAINE_LIVREUR: ${NEXT_PUBLIC_DOMAINE_LIVREUR:-}
        NEXT_PUBLIC_DOMAINE_VITRINE: ${NEXT_PUBLIC_DOMAINE_VITRINE:-}
        NEXT_PUBLIC_DOMAINE_DRIVE: ${NEXT_PUBLIC_DOMAINE_DRIVE:-}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      API_INTERNAL_URL: http://backend:3001
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.demo", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINES_SITE: ${DOMAINES_SITE:?DOMAINES_SITE manquant dans .env.demo}
      DOMAINE_API: ${DOMAINE_API}
      EMAIL_LETSENCRYPT: ${EMAIL_LETSENCRYPT:?EMAIL_LETSENCRYPT manquant dans .env.demo}
    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
