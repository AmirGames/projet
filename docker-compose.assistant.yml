# Développement : Docker expose Ollama uniquement sur la boucle locale.
# docker compose -f docker-compose.assistant.yml up -d
# docker compose -f docker-compose.assistant.yml exec ollama ollama pull qwen3:1.7b
name: zupone-assistant-local
services:
  ollama:
    image: ${ASSISTANT_OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama_models:/root/.ollama
volumes:
  ollama_models:
