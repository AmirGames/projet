# Intégration continue : chaque pull request doit compiler, passer le lint et
# les tests, sur une vraie base PostgreSQL.
#
# Le backend applique toutes les migrations sur une base vide (ce qui prouve
# qu'une installation neuve fonctionne) puis vérifie que le schéma Prisma n'a
# pas dérivé des migrations : un champ ajouté au schéma sans migration fait
# échouer le passage.
#
# Les variables des tests viennent de backend/.env.test (chargé par Jest). Seule
# DATABASE_URL est répétée ici, pour les commandes Prisma lancées avant Jest.
#
# Deux suites d'intégration (RGPD, assistant) ne s'exécutent que si on le leur
# demande : elles écrivent beaucoup et exigent une base à elles. Elles tournent
# ici chacune sur sa base dédiée, migrée comme les autres. Les six
# applications mobiles ont leur propre job : types, lint, et les tests Node
# de l'application livreur. Un job de bout en bout (E2E) démarre l'API et le
# site pour de vrai et rejoue un sous-ensemble stable des parcours navigateur
# de frontend/scripts/verif-*.mjs.
#
# Le lint est un cliquet : `--max-warnings` (dans le package.json de chaque
# application) vaut le nombre actuel d'avertissements. Un avertissement de plus
# fait échouer le passage ; quand le nombre baisse, baissez la valeur avec lui.

name: CI

on:
  pull_request:
  push:
    branches: [claude/awesome-ride-m9lci8]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Client Prisma
        run: npx prisma generate
      - name: Migrations sur base vide
        run: npx prisma migrate deploy
      - name: Schéma et migrations alignés
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      # Bases dédiées : ces suites créent et suppriment leurs propres lignes.
      - name: Bases dédiées (RGPD, assistant)
        run: |
          for base in privacy_test assistant_test; do
            PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE $base"
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$base?schema=public" npx prisma migrate deploy
          done
      - name: Intégration RGPD
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/privacy_test?schema=public
          PRIVACY_INTEGRATION: "true"
        run: npx jest src/modules/privacy/__tests__/privacy.integration.test.ts
      - name: Intégration assistant
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assistant_test?schema=public
          ASSISTANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assistant_test?schema=public
        run: npx jest src/modules/assistant/__tests__/integration.test.ts
      - name: Build
        run: npm run build
      # Informatif : l'état des dépendances ne doit pas bloquer une PR.
      - name: Audit des dépendances (informatif)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # SafetyCheck.test.jsx importe le composant de l'app mobile livreur et sa
      # copie de React : il lui faut les dépendances de cette application.
      - name: Dépendances de l'app livreur (pour SafetyCheck)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile/apps/delivery
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npx jest
      - name: Build
        run: npm run build
      - name: Audit des dépendances (informatif)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Les six applications Expo : sans ce job, une erreur de type ou une
  # régression de la session mobile passait la CI (rien ne les vérifiait).
  mobile:
    name: Mobile (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [customer, merchant, delivery, admin, zupdrive-driver, zupdrive-passenger]
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (application livreur)
        if: matrix.app == 'delivery'
        run: npm run test:alerts && npm run test:session
      - name: Tests (application passager ZupDrive)
        if: matrix.app == 'zupdrive-passenger'
        run: npm test

  # Bout en bout : l'API compilée et le site compilé tournent pour de vrai sur
  # PostgreSQL et Redis, et des parcours navigateur (Playwright) les pilotent.
  # Seules les suites qui passent de façon répétable sur une base vierge y
  # figurent ; les autres, avec la raison, sont listées dans le commentaire de
  # l'étape. Les variables de l'API viennent de backend/.env.test (valeurs
  # factices, pas de secret) ; Stripe y est coupé.
  e2e:
    name: E2E (parcours navigateur)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Le nom de la base doit contenir « test » : reinitialiser.mjs refuse sinon.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saas_test?schema=public
      VERIF_SITE_URL: http://localhost:3000
      VERIF_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Dépendances du backend
        run: npm ci
        working-directory: backend
      - name: Migrations
        run: npx prisma migrate deploy
        working-directory: backend
      - name: Build du backend
        run: npm run build
        working-directory: backend
      # Le faux service d'adresses évite de dépendre d'Internet : sans lui, une
      # adresse saisie n'est pas située et les livraisons échouent.
      - name: Démarrer l'API et le faux service d'adresses
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          ADDRESS_API_URL: http://127.0.0.1:4599/ban/
          PHOTON_API_URL: http://127.0.0.1:4599/photon/
        run: |
          nohup node scripts/verification/faux-service-adresses.mjs > "$RUNNER_TEMP/adresses.log" 2>&1 &
          nohup node --env-file=.env.test dist/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/health/ready > /dev/null && exit 0
            sleep 2
          done
          echo "L'API ne répond pas :"; cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Dépendances du frontend
        run: npm ci
        working-directory: frontend
      # Playwright n'est pas une dépendance du projet (voir LISEZ-MOI.md) :
      # installé ici sans toucher au package.json.
      - name: Playwright et Chromium
        working-directory: frontend
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build et démarrage du site
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: |
          npx next build
          nohup npx next start -p 3000 > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sS -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "Le site ne répond pas :"; cat "$RUNNER_TEMP/site.log"; exit 1
      # Sous-ensemble stable, vérifié en local (répété, base remise à zéro
      # avant chaque suite). Exclues, car elles échouent même sur une base
      # vierge, sans que rien ne soit cassé côté CI :
      #   - verif-commande-invite : la page affiche autre chose que
      #     « Commande envoyée » après confirmation (contrôles à réaligner) ;
      #   - verif-suivi-client : « Aucun livreur en ligne à proximité », la
      #     course n'est jamais proposée ;
      #   - verif-compte-restreint : la pastille de la cloche reste éteinte
      #     après suspension (échec constant, davantage de contrôles selon les
      #     passages).
      # À les réintégrer une fois ces écarts traités. L'API limite à 120 appels
      # publics par minute et par IP : verif-paniers, la plus bavarde, attend
      # que la fenêtre se vide.
      - name: Parcours navigateur
        working-directory: frontend
        run: |
          echecs=0
          for suite in session-perimee mot-de-passe-oublie paniers; do
            echo "::group::verif-$suite"
            (cd ../backend && node scripts/verification/reinitialiser.mjs)
            [ "$suite" = "paniers" ] && sleep 65
            node "scripts/verif-$suite.mjs" || { echo "::error title=E2E::verif-$suite a échoué"; echecs=$((echecs + 1)); }
            echo "::endgroup::"
          done
          [ "$echecs" -eq 0 ]
      - name: Journaux des serveurs
        if: failure()
        run: |
          for f in api site adresses; do echo "=== $f"; tail -n 100 "$RUNNER_TEMP/$f.log" || true; done
