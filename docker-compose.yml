version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: saas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit - Email testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: saas-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"

  # Scanner de fichiers des dépôts locaux. Le protocole ClamAV sur TCP n'est
  # pas chiffré : le port reste accessible uniquement depuis cette machine.
  clamav:
    image: clamav/clamav:1.5
    container_name: zupeat-clamav-test
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres_data:
  clamav_data:

# Usage:
# docker-compose up -d          # Start services
# docker-compose down            # Stop services
# docker-compose logs -f         # View logs
# Visit http://localhost:8025 for Mailpit UI
